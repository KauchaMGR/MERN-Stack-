<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    .user-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    }
    .card {
      border: 1px solid black;
      padding: 10px;
      margin: 10px;
    }
    button {
      background-color: green;
      color: white;
      padding: 10px 5px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    .heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
  <body>
    <div class="users">
      <div class="heading">
        <h1>User List</h1>
        <button onclick="addUser()">Add User</button>
      </div>
      <div id="userList" class="user-list"></div>
    </div>
  </body>
  <script>
    const url = "https://jsonplaceholder.typicode.com/users";
    const userList = document.getElementById("userList");

    async function fetchUsers() {
      try {
        const response = await fetch(url);
        const users = await response.json();

        console.log(users);
        users.forEach((user) => {
          userList.innerHTML += `<div class="card">
                <h2>${user.name}</h2>
                <p>Email: ${user.email}</p>
                <p>Phone: ${user.phone}</p>
                <p>Website: ${user.website}</p>
                <div class="btn-group">
                    <button onclick="editUser(${user.id})">Edit</button>
                    <button onclick="deleteUser(${user.id})">Delete</button>
                    </div>
            </div>`;
        });
      } catch (error) {
        console.error("Error fetching users:", error);
      }
    }
    async function addUser() {
      const name = prompt("Enter name");
      const userName = prompt("Enter username");
      const email = prompt("Enter email");
      const user = {
        name: name,
        username: userName,
        email: email,
      };
      try {
        const response = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(user),
        });
        if (!response.ok) {
          throw new Error("Failed to add user");
        }
        const data = await response.json();
        alert("User added successfully!");
        console.log(
          `User added with name: ${data.name} and username: ${data.username} and email: ${data.email}`,
        );
      } catch (error) {
        console.error("Error adding user:", error);
      }
      fetchUsers();
    }

    async function deleteUser(id) {
      try {
        const user = await fetch(`${url}/${id}`).then((res) => res.json());
        console.log(user);
        const response = await fetch(`${url}/${id}`, {
          method: "DELETE",
        });
        if (!response.ok) {
          throw new Error("Failed to delete user");
        }
        alert(
          "User deleted with name " +
            user.name +
            " and username " +
            user.username +
            " and email " +
            user.email,
        );
      } catch (error) {
        console.error("Error deleting user:", error);
      }
      fetchUsers();
    }

    async function editUser(id) {
      const user = await fetch(`${url}/${id}`).then((res) => res.json());
      const name = prompt("Enter new name", user.name);
      const userName = prompt("Enter new username", user.username);
      const email = prompt("Enter new email", user.email);
      const UpdatedUser = {
        name: name,
        username: userName,
        email: email,
      };
      try {
        const response = await fetch(`${url}/${id}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(UpdatedUser),
        });
        if (!response.ok) {
          throw new Error("Failed to update user");
        }
        const data = await response.json();
        alert(
          "User updated with name " +
            data.name +
            " and username " +
            data.username +
            " and email " +
            data.email,
        );
      } catch (error) {
        console.error("Error updating user:", error);
      }
      fetchUsers();
    }

    fetchUsers();
  </script>
</html>
