<script>
    
const getUser = async () => {
    const container = document.getElementsByClassName("card_containers")[0];
    
    try {
        const res = await fetch("https://jsonplaceholder.typicode.com/users");
        const data = await res.json();
        
        // 1. Start building the HTML structure inside a string variable
        let tableHTML = `
            <div class='card'>
                <div class="card_content">
                <table border=1>
                    <thead>
                        <tr>
                           <th>Name</th>
                           <th>Email</th>
                           <th>Phone</th>
                           <th>Website</th>
                        </tr>
                    </thead>
                    <tbody>`; // Opened tbody properly

        // 2. Loop through users and append row strings to the variable
        data.forEach(user => {
            tableHTML += `
                <tr>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td>${user.phone}</td>
                    <td>${user.website}</td>
                </tr>
            `;
        });

        // 3. Append the closing tags to the variable after the loop finishes
        tableHTML += `
                    </tbody>
                </table>
                </div>
            </div>
        `;
        
        // 4. Update the DOM container exactly once
        container.innerHTML = tableHTML;

    } catch (error) {
        console.error("Error fetching data:", error);
        container.innerHTML = "<p>Error loading user profiles.</p>";
    }
}

getUser();
