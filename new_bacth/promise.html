<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Card Render</title>
    <style>
        .card_containers {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 16px;
            width: 280px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            background-color: #fff;
        }
        .card h2 {
            font-size: 1.1rem;
            margin: 8px 0;
            color: #333;
         }
    </style>
</head>
<body>

    <div class="card_containers"></div>
    
</body>
<script>
    

    const getUser = async () => {
        const container = document.getElementsByClassName("card_containers")[0];
        
        try {
            const res = await fetch("https://jsonplaceholder.typicode.com/users");
            const data = await res.json();
            
            // 1. Create a local string buffer to assemble layouts safely
              data.forEach(user => {
                // 2. Concatenate individual strings into memory instead of mutating the DOM
                container.innerHTML += `
                    <div class='card'>
                        <div class="card_content">
                            <h2><strong>Name:</strong> ${user.name}</h2>
                            <h2><strong>Email:</strong> ${user.email}</h2>
                            <h2><strong>Phone:</strong> ${user.phone}</h2>
                            <h2><strong>Website:</strong> ${user.website}</h2>
                        </div>
                    </div>
                `;
            });

          

        } catch (error) {
            console.error("Error fetching data:", error);
            container.innerHTML = "<p>Error loading user profiles.</p>";
        }
    }

    getUser();
